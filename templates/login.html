<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Campus Safety Incident Logger</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="kiet-logo-badge">
        <i class="fas fa-university"></i>
        <span>KIET</span>
      </div>
      <span class="nav-title">CAMPUS SAFETY LOGGER</span>
    </a>

    <div class="nav-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
        <i class="fas fa-moon"></i>
      </button>
      <a href="/student-login" class="btn btn-outline btn-sm"><i class="fas fa-user-graduate"></i> Student Portal</a>
    </div>
  </nav>

  <!-- Login Card Container -->
  <main class="login-container">
    <div class="login-card">
      
      <!-- Dual Login Switcher Tabs -->
      <div style="display:flex; border:1px solid var(--border-color); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:1.5rem;">
        <a href="/student-login" style="flex:1; padding:0.6rem; text-decoration:none; color:var(--text-muted); font-weight:600; font-size:0.88rem; background:var(--bg-main); display:flex; align-items:center; justify-content:center; gap:0.4rem;">
          <i class="fas fa-user-graduate"></i> Student Login
        </a>
        <a href="/login" style="flex:1; padding:0.6rem; text-decoration:none; color:var(--primary); font-weight:700; font-size:0.88rem; background:var(--primary-light); display:flex; align-items:center; justify-content:center; gap:0.4rem; border-left:1px solid var(--border-color);">
          <i class="fas fa-user-shield"></i> Admin Login
        </a>
      </div>

      <div class="login-logo">
        <i class="fas fa-user-shield"></i>
      </div>
      <h2 style="font-size:1.6rem; font-weight:700;">Admin Control Login</h2>
      <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1rem;">Access the Campus Security Analytics & Incident Command Center.</p>

      <div class="demo-credentials-box">
        <strong><i class="fas fa-key"></i> Demo Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
        <button type="button" onclick="fillDemoCredentials()" class="btn btn-sm btn-outline" style="margin-top:0.5rem; width:100%;">
          Auto-Fill Demo Credentials
        </button>
      </div>

      <form id="adminLoginForm">
        <div class="form-group" style="text-align:left; margin-bottom:1rem;">
          <label for="username">Admin Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter admin username" required>
        </div>

        <div class="form-group" style="text-align:left; margin-bottom:1.5rem;">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;">
          <i class="fas fa-sign-in-alt"></i> Access Dashboard
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-bottom">
      &copy; <span id="currentYear">2026</span> Campus Safety Incident Logger • KIET Group of Institutions. All rights reserved.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/static/js/script.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
